openapi: 3.0.0
info:
  title: Mental Health Tracker API
  version: 0.0.0
tags:
  - name: Auth
  - name: Users
  - name: Parameters
  - name: Entries
  - name: Tests
  - name: TestResults
  - name: Feedback
  - name: OnboardingStories
  - name: Reports
  - name: Breathing
  - name: Cba
  - name: Admin
paths:
  /admin/feedback:
    get:
      operationId: AdminUsers_listFeedback
      description: Все сообщения обратной связи всех пользователей (только для администратора)
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminFeedback'
      tags:
        - Admin
  /admin/users:
    get:
      operationId: AdminUsers_listUsers
      description: Список всех пользователей (только для администратора)
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
      tags:
        - Admin
  /admin/users/{id}:
    delete:
      operationId: AdminUsers_deleteUser
      description: Удалить пользователя вместе со всеми данными (только для администратора)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Admin
  /auth/forgot-password:
    post:
      operationId: Auth_forgotPassword
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
  /auth/login:
    post:
      operationId: Auth_login
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/logout:
    post:
      operationId: Auth_logout
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Auth
  /auth/refresh:
    post:
      operationId: Auth_refresh
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
      tags:
        - Auth
  /auth/register:
    post:
      operationId: Auth_register
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
  /auth/reset-info:
    post:
      operationId: Auth_resetInfo
      description: Отдать recovery-материал (wrappedKey/salt) по токену сброса пароля
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetInfoResponse'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetInfoRequest'
  /auth/reset-password:
    post:
      operationId: Auth_resetPassword
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
  /cba/common-items:
    get:
      operationId: Cba_listCommonItems
      description: Общий банк типовых пунктов плюсов/минусов
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CbaCommonItem'
      tags:
        - Cba
  /cba/entries:
    post:
      operationId: Cba_createEntry
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CbaEntry'
      tags:
        - Cba
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CbaEntryCreate'
    get:
      operationId: Cba_listEntries
      description: История записей текущего пользователя, новые сверху
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CbaEntry'
      tags:
        - Cba
  /cba/entries/{id}:
    delete:
      operationId: Cba_deleteEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Cba
  /cba/examples:
    get:
      operationId: Cba_listExamples
      description: Библиотека разобранных обучающих примеров
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CbaExample'
      tags:
        - Cba
  /creature:
    get:
      operationId: Creature_getState
      description: Получить текущее состояние существа
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatureState'
      tags:
        - Breathing
  /creature/check-in:
    post:
      operationId: Creature_checkIn
      description: Ежедневная отметка — восстанавливает энергию, начисляет опыт, обновляет streak
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
      tags:
        - Breathing
  /creature/completions:
    get:
      operationId: Creature_getCompletions
      description: История выполненных практик за последние N дней (по умолчанию 30)
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PracticeCompletion'
      tags:
        - Breathing
  /creature/exercise/complete:
    post:
      operationId: Creature_completeExercise
      description: Завершить дыхательное упражнение, обновить уровень спокойствия, начислить опыт
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
      tags:
        - Breathing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreathingCompleteRequest'
  /creature/pet:
    patch:
      operationId: Creature_setPet
      description: Активировать питомца и/или задать имя
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetCollection'
      tags:
        - Breathing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetUpdateRequest'
  /creature/pets:
    get:
      operationId: Creature_getPets
      description: Получить коллекцию питомцев пользователя
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetCollection'
      tags:
        - Breathing
  /creature/reward:
    post:
      operationId: Creature_reward
      description: Начислить опыт за выполнение практики (gratitude, sleepHygiene, distortions, cba)
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardResponse'
      tags:
        - Breathing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewardRequest'
  /entries:
    get:
      operationId: Entries_list
      parameters:
        - name: parameterId
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          explode: false
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entry'
      tags:
        - Entries
    post:
      operationId: Entries_create
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
      tags:
        - Entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryCreate'
  /entries/{id}:
    get:
      operationId: Entries_get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
      tags:
        - Entries
    patch:
      operationId: Entries_update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
      tags:
        - Entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryUpdate'
    delete:
      operationId: Entries_delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Entries
  /feedback:
    post:
      operationId: FeedbackApi_create
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
      tags:
        - Feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
  /feedback/me:
    get:
      operationId: FeedbackApi_listMine
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feedback'
      tags:
        - Feedback
  /onboarding-stories:
    get:
      operationId: OnboardingStories_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnboardingStory'
      tags:
        - OnboardingStories
  /parameters:
    get:
      operationId: Parameters_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parameter'
      tags:
        - Parameters
  /reports:
    post:
      operationId: Reports_create
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
      tags:
        - Reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
    get:
      operationId: Reports_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
      tags:
        - Reports
  /reports/{id}:
    get:
      operationId: Reports_get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
      tags:
        - Reports
    delete:
      operationId: Reports_delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Reports
  /reports/{id}/download:
    get:
      operationId: Reports_download
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      tags:
        - Reports
  /test-results:
    get:
      operationId: TestResults_list
      parameters:
        - name: testId
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestResult'
      tags:
        - TestResults
  /test-results/{id}:
    get:
      operationId: TestResults_get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResult'
      tags:
        - TestResults
  /tests:
    get:
      operationId: Tests_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestDigest'
      tags:
        - Tests
  /tests/{id}:
    get:
      operationId: Tests_get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
      tags:
        - Tests
  /users/me:
    get:
      operationId: Users_getMe
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      tags:
        - Users
    patch:
      operationId: Users_updateMe
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
    delete:
      operationId: Users_deleteMe
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Users
  /users/me/preferences:
    get:
      operationId: Users_getPreferences
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreference'
      tags:
        - Users
    put:
      operationId: Users_savePreferences
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreference'
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferenceUpdate'
security:
  - BearerAuth: []
components:
  schemas:
    AdminFeedback:
      type: object
      required:
        - id
        - rating
        - message
        - createdAt
        - user
      properties:
        id:
          type: string
        rating:
          type: integer
          format: int32
          description: Оценка приложения от 1 до 5
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        user:
          type: object
          properties:
            email:
              type: string
            name:
              type: string
          required:
            - email
      description: Запись обратной связи для админ-панели (все пользователи)
    AdminUser:
      type: object
      required:
        - id
        - email
        - role
        - createdAt
        - emailVerified
        - ageConfirmed
        - entriesCount
        - testResultsCount
        - breathingSessionsCount
        - cbaEntriesCount
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
        createdAt:
          type: string
          format: date-time
        emailVerified:
          type: boolean
        ageConfirmed:
          type: boolean
        entriesCount:
          type: integer
          format: int32
        testResultsCount:
          type: integer
          format: int32
        breathingSessionsCount:
          type: integer
          format: int32
        cbaEntriesCount:
          type: integer
          format: int32
      description: Запись списка пользователей для админ-панели
    AuthResponse:
      type: object
      required:
        - accessToken
        - user
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
        wrappedKey:
          type: string
          description: DEK, зашифрованный ключом из пароля — нужен клиенту для разблокировки данных при логине
        keySalt:
          type: string
          description: Соль для вывода KEK из пароля
    BreathingCompleteRequest:
      type: object
      required:
        - duration
      properties:
        duration:
          type: integer
          format: int32
          description: Длительность упражнения в секундах
      description: Результат завершённого дыхательного упражнения
    BreathingSession:
      type: object
      required:
        - id
        - userId
        - duration
        - initialCalmness
        - finalCalmness
        - completedAt
      properties:
        id:
          type: string
        userId:
          type: string
        duration:
          type: integer
          format: int32
          description: Длительность упражнения в секундах
        initialCalmness:
          type: integer
          format: int32
          description: Уровень спокойствия до упражнения
        finalCalmness:
          type: integer
          format: int32
          description: Уровень спокойствия после упражнения
        completedAt:
          type: string
          format: date-time
      description: Сессия дыхательного упражнения
    CbaCommonItem:
      type: object
      required:
        - id
        - itemType
        - itemText
        - category
        - itemKey
      properties:
        id:
          type: string
        itemType:
          $ref: '#/components/schemas/CbaItemType'
        itemText:
          type: string
        category:
          $ref: '#/components/schemas/CbaItemCategory'
        itemKey:
          type: string
      description: Типовой пункт из общего банка подсказок для заполнения формы CBA
    CbaEntry:
      type: object
      required:
        - id
        - userId
        - thoughtText
        - prosWeight
        - consWeight
        - createdAt
        - items
      properties:
        id:
          type: string
        userId:
          type: string
        thoughtText:
          type: string
        prosWeight:
          type: integer
          format: int32
        consWeight:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/CbaEntryItem'
      description: 'Запись пользователя в технике "анализ издержек и выгод": мысль + плюсы/минусы + соотношение (в сумме 100)'
    CbaEntryCreate:
      type: object
      required:
        - thoughtText
        - prosWeight
        - consWeight
        - items
      properties:
        thoughtText:
          type: string
        prosWeight:
          type: integer
          format: int32
        consWeight:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/CbaEntryItemInput'
    CbaEntryItem:
      type: object
      required:
        - id
        - itemType
        - itemText
      properties:
        id:
          type: string
        itemType:
          $ref: '#/components/schemas/CbaItemType'
        itemText:
          type: string
    CbaEntryItemInput:
      type: object
      required:
        - itemType
        - itemText
      properties:
        itemType:
          $ref: '#/components/schemas/CbaItemType'
        itemText:
          type: string
    CbaExample:
      type: object
      required:
        - id
        - persona
        - thoughtText
        - prosWeight
        - consWeight
        - order
        - items
        - distortions
      properties:
        id:
          type: string
        persona:
          type: string
        thoughtText:
          type: string
        prosWeight:
          type: integer
          format: int32
        consWeight:
          type: integer
          format: int32
        order:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/CbaExampleItem'
        distortions:
          type: array
          items:
            $ref: '#/components/schemas/CbaExampleDistortion'
      description: Разобранный обучающий пример техники "анализ издержек и выгод" на вымышленном персонаже
    CbaExampleDistortion:
      type: object
      required:
        - id
        - exampleId
        - distortionKey
      properties:
        id:
          type: string
        exampleId:
          type: string
        distortionKey:
          type: string
      description: Когнитивное искажение, отмеченное в мысли обучающего примера (ключ из библиотеки искажений)
    CbaExampleItem:
      type: object
      required:
        - id
        - itemType
        - itemText
      properties:
        id:
          type: string
        itemType:
          $ref: '#/components/schemas/CbaItemType'
        itemText:
