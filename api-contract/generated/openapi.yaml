openapi: 3.0.0
info:
  title: Mental Health Tracker API
  version: 0.0.0
tags:
  - name: Auth
  - name: Users
  - name: Parameters
  - name: Entries
  - name: Tests
  - name: TestResults
  - name: Feedback
  - name: OnboardingStories
  - name: Reports
  - name: Breathing
  - name: Cba
  - name: EmotionLab
  - name: Admin
  - name: Content
paths:
  /admin/feedback:
    get:
      operationId: AdminUsers_listFeedback
      description: Все сообщения обратной связи всех пользователей (только для администратора)
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminFeedback'
      tags:
        - Admin
  /admin/users:
    get:
      operationId: AdminUsers_listUsers
      description: Список всех пользователей (только для администратора)
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
      tags:
        - Admin
  /admin/users/{id}:
    delete:
      operationId: AdminUsers_deleteUser
      description: Удалить пользователя вместе со всеми данными (только для администратора)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Admin
  /admin/users/{id}/tier:
    patch:
      operationId: AdminUsers_updateUserTier
      description: Вручную выставить тариф пользователя (биллинга нет, только для администратора)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserTierResult'
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserTierUpdate'
  /auth/forgot-password:
    post:
      operationId: Auth_forgotPassword
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
  /auth/login:
    post:
      operationId: Auth_login
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/logout:
    post:
      operationId: Auth_logout
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Auth
  /auth/refresh:
    post:
      operationId: Auth_refresh
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
      tags:
        - Auth
  /auth/register:
    post:
      operationId: Auth_register
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
  /auth/reset-info:
    post:
      operationId: Auth_resetInfo
      description: Отдать recovery-материал (wrappedKey/salt) по токену сброса пароля
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetInfoResponse'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetInfoRequest'
  /auth/reset-password:
    post:
      operationId: Auth_resetPassword
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
  /auth/set-keys:
    post:
      operationId: Auth_setKeys
      description: Сохранить E2E-ключи для legacy-учётки (только если ключей ещё нет); требователен к авторизации
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetKeysOk'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetKeysRequest'
  /cba/common-items:
    get:
      operationId: Cba_listCommonItems
      description: Общий банк типовых пунктов плюсов/минусов
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CbaCommonItem'
      tags:
        - Cba
  /cba/entries:
    post:
      operationId: Cba_createEntry
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CbaEntry'
      tags:
        - Cba
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CbaEntryCreate'
    get:
      operationId: Cba_listEntries
      description: История записей текущего пользователя, новые сверху
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CbaEntry'
      tags:
        - Cba
  /cba/entries/{id}:
    delete:
      operationId: Cba_deleteEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Cba
  /cba/examples:
    get:
      operationId: Cba_listExamples
      description: Библиотека разобранных обучающих примеров
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CbaExample'
      tags:
        - Cba
  /content/message-of-day:
    get:
      operationId: Content_messageOfDay
      description: Пожелание дня (morning/day/evening) для текущего пользователя
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: locale
          in: query
          required: true
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOfDay'
      tags:
        - Content
  /content/messages:
    get:
      operationId: Content_listMessages
      description: Список пожеланий (только контент-менеджер/админ)
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: locale
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: active
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MotivationMessage'
      tags:
        - Content
    post:
      operationId: Content_createMessage
      description: Создать пожелание (только контент-менеджер/админ)
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotivationMessage'
      tags:
        - Content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotivationMessageCreate'
  /content/messages/{id}:
    patch:
      operationId: Content_updateMessage
      description: Обновить пожелание (только контент-менеджер/админ)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotivationMessage'
      tags:
        - Content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotivationMessageUpdate'
    delete:
      operationId: Content_deleteMessage
      description: Удалить пожелание (только контент-менеджер/админ)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Content
  /creature:
    get:
      operationId: Creature_getState
      description: Получить текущее состояние существа
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatureState'
      tags:
        - Breathing
  /creature/check-in:
    post:
      operationId: Creature_checkIn
      description: Ежедневная отметка — восстанавливает энергию, начисляет опыт, обновляет streak
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
      tags:
        - Breathing
  /creature/completions:
    get:
      operationId: Creature_getCompletions
      description: История выполненных практик за последние N дней (по умолчанию 30)
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PracticeCompletion'
      tags:
        - Breathing
  /creature/exercise/complete:
    post:
      operationId: Creature_completeExercise
      description: Завершить дыхательное упражнение, обновить уровень спокойствия, начислить опыт
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
      tags:
        - Breathing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreathingCompleteRequest'
  /creature/pet:
    post:
      operationId: Creature_pet
      description: 'Погладить компаньона: цикл 1-2-3 с XP и скрытыми бонусами (утро/вечер/комбо/возвращение/эмпатия)'
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
      tags:
        - Breathing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetRequest'
    patch:
      operationId: Creature_setPet
      description: Активировать питомца и/или задать имя
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetCollection'
      tags:
        - Breathing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetUpdateRequest'
  /creature/pets:
    get:
      operationId: Creature_getPets
      description: Получить коллекцию питомцев пользователя
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetCollection'
      tags:
        - Breathing
  /creature/play:
    post:
      operationId: Creature_play
      description: 'Играть с компаньоном: −10 энергии, +2 XP, лимит 5 игр в сутки'
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayResponse'
      tags:
        - Breathing
  /creature/reward:
    post:
      operationId: Creature_reward
      description: Начислить опыт за выполнение практики (gratitude, sleepHygiene, distortions, cba)
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardResponse'
      tags:
        - Breathing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewardRequest'
  /creature/weekly:
    get:
      operationId: Creature_getWeekly
      description: 'Недельный календарь практик (Пн–Вс): прогресс к цели, статус подарка +25 XP'
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyState'
      tags:
        - Breathing
  /creature/weekly/claim:
    post:
      operationId: Creature_claimWeekly
      description: Забрать недельный подарок +XP (одноразово на неделю, только при достигнутой цели)
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimWeeklyResponse'
      tags:
        - Breathing
  /emotion-lab/attempt:
    post:
      operationId: EmotionLab_attempt
      description: "Смешать две эмоции: проверяет дневной лимит и доступность уровня диады. При исчерпании лимита — 403 { error: 'daily_limit_reached', limit, tier, resetsAt }"
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmotionLabAttemptResponse'
      tags:
        - EmotionLab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmotionLabAttemptRequest'
  /emotion-lab/state:
    get:
      operationId: EmotionLab_getState
      description: 'Состояние лаборатории эмоций: открытые диады, доступный уровень, оставшиеся попытки сегодня'
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmotionLabState'
      tags:
        - EmotionLab
  /entries:
    get:
      operationId: Entries_list
      parameters:
        - name: parameterId
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          explode: false
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entry'
      tags:
        - Entries
    post:
      operationId: Entries_create
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
      tags:
        - Entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryCreate'
  /entries/{id}:
    get:
      operationId: Entries_get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
      tags:
        - Entries
    patch:
      operationId: Entries_update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
      tags:
        - Entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryUpdate'
    delete:
      operationId: Entries_delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Entries
  /feedback:
    post:
      operationId: FeedbackApi_create
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
      tags:
        - Feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
  /feedback/me:
    get:
      operationId: FeedbackApi_listMine
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feedback'
      tags:
        - Feedback
  /onboarding-stories:
    get:
      operationId: OnboardingStories_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnboardingStory'
      tags:
        - OnboardingStories
  /parameters:
    get:
      operationId: Parameters_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parameter'
      tags:
        - Parameters
  /reports:
    post:
      operationId: Reports_create
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
      tags:
        - Reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
    get:
      operationId: Reports_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
      tags:
        - Reports
  /reports/{id}:
    get:
      operationId: Reports_get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
      tags:
        - Reports
    delete:
      operationId: Reports_delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Reports
  /reports/{id}/download:
    get:
      operationId: Reports_download
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      tags:
        - Reports
  /test-results:
    get:
      operationId: TestResults_list
      parameters:
        - name: testId
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestResult'
      tags:
        - TestResults
  /test-results/{id}:
    get:
      operationId: TestResults_get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResult'
      tags:
        - TestResults
  /tests:
    get:
      operationId: Tests_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestDigest'
      tags:
        - Tests
  /tests/{id}:
    get:
      operationId: Tests_get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
      tags:
        - Tests
  /users/me:
    get:
      operationId: Users_getMe
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      tags:
        - Users
    patch:
      operationId: Users_updateMe
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
    delete:
      operationId: Users_deleteMe
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Users
  /users/me/preferences:
    get:
      operationId: Users_getPreferences
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreference'
      tags:
        - Users
    put:
      operationId: Users_savePreferences
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreference'
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferenceUpdate'
security:
  - BearerAuth: []
components:
  schemas:
