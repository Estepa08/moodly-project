<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" font-family="system-ui, sans-serif">
  <title>Distortions Library — сетка 2 колонки</title>
  <style>
    .bg { fill: #f5f3ff; }
    .card { fill: #fff; stroke: #e0daf0; stroke-width: 1; rx: 12; }
    .card-collapsed { fill: #fff; stroke: #e0daf0; stroke-width: 1; rx: 12; }
    .card-expanded { fill: #fff; stroke: #c4b5fd; stroke-width: 1; rx: 12; }
    .accent-line { stroke: #a78bfa; stroke-width: 3; rx: 0; }
    .title { fill: #2e1065; font-size: 14px; font-weight: 700; }
    .text { fill: #6b7280; font-size: 11px; }
    .text-expanded { fill: #374151; font-size: 11px; }
    .link { fill: #7c3aed; font-size: 11px; font-weight: 600; }
    .icon { fill: #7c3aed; }
    .label { fill: #a1a1aa; font-size: 9px; }
    .tag { fill: #f0eefb; rx: 4; }
    .tag-text { fill: #7c3aed; font-size: 9px; font-weight: 600; }
    .shadow { fill: rgba(160,140,180,0.12); rx: 12; }
  </style>

  <rect class="bg" width="640" height="720"/>

  <!-- Page title -->
  <text x="320" y="32" font-size="18" font-weight="700" fill="#2e1065" text-anchor="middle" font-family="Georgia, serif">Когнитивные искажения</text>
  <text x="320" y="48" class="text" text-anchor="middle">Библиотека когнитивно-поведенческой терапии</text>

  <!-- Tab bar -->
  <rect x="208" y="60" width="224" height="36" rx="12" fill="#fff" stroke="#e0daf0" stroke-width="1"/>
  <rect x="210" y="62" width="72" height="32" rx="10" fill="#7c3aed"/>
  <text x="246" y="82" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">Библиотека</text>
  <text x="296" y="82" class="text" text-anchor="middle">Квиз</text>
  <text x="382" y="82" class="text" text-anchor="middle">Отпустить</text>

  <!-- Row 1: 2 cards -->
  <!-- Card 1 — collapsed -->
  <g transform="translate(16, 112)">
    <rect class="shadow" x="0" y="2" width="292" height="156"/>
    <rect class="card-collapsed" x="0" y="0" width="292" height="156"/>
    <rect class="accent-line" x="0" y="0" width="292" height="0" stroke="#a78bfa" stroke-width="3" fill="none" rx="0" clip-path="inset(0 0 0 0 round 12px)"/>
    <text class="title" x="16" y="28">Чёрно-белое мышление</text>
    <text class="text" x="16" y="50">Тенденция оценивать всё в крайних категориях, без середины. Ситуация либо идеальна, либо ужасна —...</text>
    <text class="link" x="16" y="138">▶ Показать пример</text>
  </g>

  <!-- Card 2 — collapsed -->
  <g transform="translate(332, 112)">
    <rect class="shadow" x="0" y="2" width="292" height="156"/>
    <rect class="card-collapsed" x="0" y="0" width="292" height="156"/>
    <rect class="accent-line" x="0" y="0" width="292" height="0" stroke="#a78bfa" stroke-width="3" fill="none" rx="0" clip-path="inset(0 0 0 0 round 12px)"/>
    <text class="title" x="16" y="28">Сверхобобщение</text>
    <text class="text" x="16" y="50">Вывод общего правила на основе единичного случая. Одна неудача воспринимается как закономерность, а не...</text>
    <text class="link" x="16" y="138">▶ Показать пример</text>
  </g>

  <!-- Row 2: 2 cards -->
  <!-- Card 3 — collapsed -->
  <g transform="translate(16, 284)">
    <rect class="shadow" x="0" y="2" width="292" height="156"/>
    <rect class="card-collapsed" x="0" y="0" width="292" height="156"/>
    <rect class="accent-line" x="0" y="0" width="292" height="0" stroke="#a78bfa" stroke-width="3" fill="none" rx="0" clip-path="inset(0 0 0 0 round 12px)"/>
    <text class="title" x="16" y="28">Ментальный фильтр</text>
    <text class="text" x="16" y="50">Фокусировка на одной негативной детали, игнорирование всей положительной картины. Один недостаток перевешивает...</text>
    <text class="link" x="16" y="138">▶ Показать пример</text>
  </g>

  <!-- Card 4 — expanded -->
  <g transform="translate(332, 284)">
    <rect class="shadow" x="0" y="2" width="292" height="220"/>
    <rect class="card-expanded" x="0" y="0" width="292" height="220"/>
    <rect class="accent-line" x="0" y="0" width="292" height="0" stroke="#7c3aed" stroke-width="3" fill="none" rx="0" clip-path="inset(0 0 0 0 round 12px)"/>
    <text class="title" x="16" y="28">Обесценивание позитивного</text>
    <text class="text" x="16" y="50">Отказ признавать свои достижения — они «не считаются» или «случайны». Положительные события...</text>
    <rect class="tag" x="16" y="68" width="100" height="18"/>
    <text class="tag-text" x="20" y="81">Пример мысли</text>
    <text class="text-expanded" x="16" y="100">«Меня похвалили, потому что пожалели, а не потому что я хорошо сделал работу. На самом деле я никчёмный.»</text>
    <rect class="tag" x="16" y="134" width="68" height="18"/>
    <text class="tag-text" x="20" y="147">Рефрейм</text>
    <text class="text-expanded" x="16" y="166">Люди не тратят время на ложную похвалу. Я заслужил признание своим трудом.</text>
    <text class="link" x="16" y="202">▼ Скрыть пример</text>
  </g>

  <!-- Row 3: 2 cards -->
  <!-- Card 5 — collapsed -->
  <g transform="translate(16, 520)">
    <rect class="shadow" x="0" y="2" width="292" height="156"/>
    <rect class="card-collapsed" x="0" y="0" width="292" height="156"/>
    <rect class="accent-line" x="0" y="0" width="292" height="0" stroke="#a78bfa" stroke-width="3" fill="none" rx="0" clip-path="inset(0 0 0 0 round 12px)"/>
    <text class="title" x="16" y="28">Поспешные выводы</text>
    <text class="text" x="16" y="50">Склонность делать негативные заключения без достаточных оснований. Чтение мыслей и предсказание худшего...</text>
    <text class="link" x="16" y="138">▶ Показать пример</text>
  </g>

  <!-- Card 6 — collapsed -->
  <g transform="translate(332, 520)">
    <rect class="shadow" x="0" y="2" width="292" height="156"/>
    <rect class="card-collapsed" x="0" y="0" width="292" height="156"/>
    <rect class="accent-line" x="0" y="0" width="292" height="0" stroke="#a78bfa" stroke-width="3" fill="none" rx="0" clip-path="inset(0 0 0 0 round 12px)"/>
    <text class="title" x="16" y="28">Катастрофизация</text>
    <text class="text" x="16" y="50">Преувеличение важности или масштаба проблемы. Маленькая неудача раздувается до катастрофы с ужасными...</text>
    <text class="link" x="16" y="138">▶ Показать пример</text>
  </g>

  <!-- Legend -->
  <g transform="translate(16, 692)">
    <text class="label">● 10 карточек в сетке 2 колонки (5 рядов)</text>
    <text class="label" x="0" y="14">● 292&nbsp;×&nbsp;156&nbsp;px (collapsed), 292&nbsp;×&nbsp;220&nbsp;px (expanded)</text>
    <text class="label" x="0" y="28">● Акцентная полоска primary сверху → primary/60 при раскрытии</text>
  </g>
</svg>
