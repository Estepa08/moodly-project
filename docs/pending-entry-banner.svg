<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#f5f0eb" rx="16"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">PendingEntryBanner — макет</text>

  <!-- ============ STATE 1: Collapsed ============ -->
  <text x="40" y="80" font-size="13" font-weight="600" fill="#666">Состояние 1: Свёрнут (есть незаполненные entry за сегодня)</text>

  <rect x="40" y="94" width="720" height="56" rx="12" fill="#fff" filter="url(#shadow)"/>
  <!-- Left accent -->
  <rect x="40" y="94" width="4" height="56" rx="2" fill="#e8a87c"/>
  <!-- Sun icon placeholder -->
  <circle cx="80" cy="122" r="14" fill="#f5d742" opacity="0.3"/>
  <circle cx="80" cy="122" r="8" fill="#f5d742"/>
  <text x="80" y="126" text-anchor="middle" font-size="12">☀️</text>
  <!-- Text -->
  <text x="110" y="118" font-size="14" font-weight="500" fill="#1a1a1a">Сегодня ещё не заполнили самочувствие</text>
  <text x="110" y="137" font-size="11" fill="#888">Нажмите, чтобы записать настроение, энергию, сон и тревогу</text>
  <!-- Arrow button -->
  <rect x="660" y="106" width="80" height="32" rx="16" fill="#1a1a1a"/>
  <text x="700" y="126" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Заполнить</text>

  <!-- Divider -->
  <line x1="40" y1="180" x2="760" y2="180" stroke="#ddd" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ============ STATE 2: Expanded ============ -->
  <text x="40" y="214" font-size="13" font-weight="600" fill="#666">Состояние 2: Развёрнут (после нажатия)</text>

  <rect x="40" y="228" width="720" height="344" rx="12" fill="#fff" filter="url(#shadow)"/>
  <!-- Left accent -->
  <rect x="40" y="228" width="4" height="344" rx="2" fill="#e8a87c"/>
  <!-- Header row -->
  <text x="110" y="262" font-size="14" font-weight="500" fill="#1a1a1a">Сегодня ещё не заполнили самочувствие</text>
  <!-- Collapse button -->
  <rect x="660" y="246" width="80" height="32" rx="16" fill="#f0eeeb"/>
  <text x="700" y="266" text-anchor="middle" font-size="12" font-weight="500" fill="#666">Свернуть</text>

  <!-- Quick Entry Icons (4 icon buttons) -->
  <!-- Mood -->
  <rect x="100" y="284" width="120" height="90" rx="12" fill="#faf6f2" stroke="#e8a87c" stroke-width="2"/>
  <circle cx="160" cy="316" r="22" fill="#e8a87c" opacity="0.15"/>
  <text x="160" y="321" text-anchor="middle" font-size="18">😊</text>
  <text x="160" y="352" text-anchor="middle" font-size="11" fill="#666">Настроение</text>

  <!-- Anxiety -->
  <rect x="240" y="284" width="120" height="90" rx="12" fill="#fff" stroke="#e0ddd8" stroke-width="1"/>
  <circle cx="300" cy="316" r="22" fill="#f0eeeb"/>
  <text x="300" y="321" text-anchor="middle" font-size="18">😰</text>
  <text x="300" y="352" text-anchor="middle" font-size="11" fill="#666">Тревога</text>

  <!-- Sleep -->
  <rect x="380" y="284" width="120" height="90" rx="12" fill="#fff" stroke="#e0ddd8" stroke-width="1"/>
  <circle cx="440" cy="316" r="22" fill="#f0eeeb"/>
  <text x="440" y="321" text-anchor="middle" font-size="18">😴</text>
  <text x="440" y="352" text-anchor="middle" font-size="11" fill="#666">Сон</text>

  <!-- Energy -->
  <rect x="520" y="284" width="120" height="90" rx="12" fill="#fff" stroke="#e0ddd8" stroke-width="1"/>
  <circle cx="580" cy="316" r="22" fill="#f0eeeb"/>
  <text x="580" y="321" text-anchor="middle" font-size="18">⚡</text>
  <text x="580" y="352" text-anchor="middle" font-size="11" fill="#666">Энергия</text>

  <!-- Slider -->
  <rect x="100" y="394" width="580" height="56" rx="10" fill="#faf6f2"/>
  <text x="120" y="420" font-size="24" font-weight="700" fill="#e8a87c">5</text>
  <!-- Slider track -->
  <rect x="160" y="414" width="420" height="6" rx="3" fill="#e0ddd8"/>
  <rect x="160" y="414" width="200" height="6" rx="3" fill="#e8a87c"/>
  <circle cx="360" cy="417" r="12" fill="#fff" stroke="#e8a87c" stroke-width="2"/>
  <!-- Slider numbers -->
  <text x="170" y="439" font-size="9" fill="#999">0</text>
  <text x="230" y="439" font-size="9" fill="#999">1</text>
  <text x="290" y="439" font-size="9" fill="#999">2</text>
  <text x="350" y="439" font-size="9" fill="#999">3</text>
  <text x="410" y="439" font-size="9" fill="#999">4</text>
  <text x="470" y="439" font-size="9" fill="#999">5</text>
  <text x="530" y="439" font-size="9" fill="#999">6</text>
  <text x="590" y="439" font-size="9" fill="#999">7</text>
  <text x="650" y="439" font-size="9" fill="#999">8</text>
  <text x="710" y="439" font-size="9" fill="#999">9</text>
  <text x="770" y="439" font-size="9" fill="#999">10</text>

  <!-- Footer buttons -->
  <rect x="280" y="466" width="120" height="36" rx="18" fill="#1a1a1a"/>
  <text x="340" y="489" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">Сохранить</text>

  <rect x="420" y="466" width="120" height="36" rx="18" fill="transparent" stroke="#ccc" stroke-width="1"/>
  <text x="480" y="489" text-anchor="middle" font-size="12" fill="#666">+ Добавить заметку</text>

  <!-- Loading spinner placeholder -->
  <text x="700" y="520" font-size="11" fill="#999">(спиннер при загрузке)</text>

  <!-- ============ Dimensions annotation ============ -->
  <line x1="40" y1="590" x2="760" y2="590" stroke="#ccc" stroke-width="0.5"/>
  <text x="400" y="580" text-anchor="middle" font-size="10" fill="#999">Ширина: 100% контейнера (max 720px)</text>

  <!-- Collapsed height annotation -->
  <line x1="780" y1="94" x2="790" y2="94" stroke="#999" stroke-width="1"/>
  <line x1="790" y1="94" x2="790" y2="150" stroke="#999" stroke-width="1"/>
  <line x1="780" y1="150" x2="790" y2="150" stroke="#999" stroke-width="1"/>
  <text x="792" y="126" font-size="9" fill="#999">56px</text>

  <!-- Expanded height annotation -->
  <line x1="780" y1="228" x2="790" y2="228" stroke="#999" stroke-width="1"/>
  <line x1="790" y1="228" x2="790" y2="572" stroke="#999" stroke-width="1"/>
  <line x1="780" y1="572" x2="790" y2="572" stroke="#999" stroke-width="1"/>
  <text x="792" y="404" font-size="9" fill="#999">344px</text>
</svg>
