<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 820" font-family="system-ui, sans-serif">
  <title>Dashboard с еженедельным дайджестом</title>
  <style>
    .bg { fill: #f5f5f4; }
    .card { fill: #fff; stroke: #e7e5e4; stroke-width: 1; rx: 12; }
    .chip { fill: #f0f0ee; rx: 8; }
    .text-dark { fill: #1c1917; font-size: 14px; font-weight: 600; }
    .text-muted { fill: #a8a29e; font-size: 11px; }
    .score { fill: #6366f1; font-size: 30px; font-weight: 700; }
    .primary { fill: #6366f1; }
    .accent { fill: #22c55e; }
    .line { stroke: #d6d3d1; stroke-width: 0.5; }
  </style>
  <rect class="bg" width="480" height="820"/>

  <!-- Period Selector -->
  <rect class="card" x="16" y="16" width="448" height="44"/>
  <text x="32" y="44" class="text-dark">Аналитика</text>
  <rect class="chip" x="280" y="24" width="168" height="28"/>
  <text x="296" y="43" class="text-muted">За 2 недели</text>

  <!-- WellbeingCard (no link) -->
  <rect class="card" x="16" y="76" width="448" height="60"/>
  <circle cx="44" cy="106" r="14" class="primary" opacity="0.15"/>
  <text x="44" y="111" font-size="16" fill="#6366f1" text-anchor="middle">❤</text>
  <text x="68" y="111" font-size="14" font-weight="600" fill="#1c1917">Самочувствие</text>
  <text x="400" y="111" class="score" text-anchor="end">7.2</text>
  <polyline points="408,111 412,103 416,111 420,103 424,111" fill="none" stroke="#6366f1" stroke-width="2.5"/>

  <!-- Parameter Trends Chart -->
  <rect class="card" x="16" y="152" width="448" height="200"/>
  <rect x="32" y="168" width="16" height="16" rx="4" fill="#6366f1" opacity="0.3"/>
  <text x="56" y="181" class="text-dark">Как вы себя чувствовали</text>
  <rect class="chip" x="32" y="196" width="416" height="100"/>
  <polyline points="64,252 160,240 256,248 352,236 440,244" fill="none" stroke="#a855f7" stroke-width="2"/>
  <polyline points="64,260 160,250 256,258 352,246 440,254" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <!-- Toggles -->
  <rect class="chip" x="32" y="308" width="88" height="26"/>
  <rect class="chip" x="128" y="308" width="66" height="26"/>
  <rect class="chip" x="202" y="308" width="80" height="26"/>
  <rect class="chip" x="290" y="308" width="72" height="26"/>

  <!-- Weekly Digest -->
  <rect class="card" x="16" y="368" width="448" height="420"/>
  <circle cx="44" cy="384" r="8" class="primary" opacity="0.25"/>
  <text x="60" y="389" class="text-dark">Недельный дайджест</text>
  <text x="200" y="389" class="text-muted">26 июл — 1 авг</text>

  <!-- Overview grid 2x2 -->
  <rect class="chip" x="32" y="408" width="200" height="52"/>
  <text x="44" y="424" class="text-muted">Записей</text>
  <text x="44" y="448" class="score" font-size="22">24</text>

  <rect class="chip" x="248" y="408" width="200" height="52"/>
  <text x="260" y="424" class="text-muted">Дней отметок</text>
  <text x="260" y="448" font-size="22" font-weight="700" fill="#22c55e">7</text>

  <rect class="chip" x="32" y="468" width="200" height="52"/>
  <text x="44" y="484" class="text-muted">XP получено</text>
  <text x="44" y="508" class="score" font-size="22">+140</text>

  <rect class="chip" x="248" y="468" width="200" height="52"/>
  <text x="260" y="484" class="text-muted">Уровень питомца</text>
  <text x="260" y="508" class="score" font-size="22">5</text>

  <!-- Digest Charts -->
  <rect class="card" x="32" y="536" width="416" height="120"/>
  <text x="48" y="556" class="text-dark" font-size="12">Средние значения</text>
  <rect class="chip" x="48" y="568" width="182" height="76"/>
  <rect class="chip" x="238" y="568" width="200" height="76"/>

  <!-- Averages grid -->
  <rect class="card" x="32" y="668" width="416" height="52"/>
  <text x="48" y="688" class="text-dark" font-size="12">Средние значения</text>
  <text x="280" y="706" class="text-muted" font-size="10">Mood 6.5</text>
  <text x="380" y="706" class="text-muted" font-size="10">Energy 5.8</text>
  <text x="280" y="696" class="text-muted" font-size="10">Sleep 7.2</text>
  <text x="380" y="696" class="text-muted" font-size="10">Anxiety 3.5</text>

  <!-- Practices grid -->
  <rect class="card" x="32" y="732" width="416" height="44"/>
  <text x="48" y="752" class="text-dark" font-size="12">Выполнено практик</text>
  <text x="280" y="764" class="text-muted" font-size="10">Дыхание 3x</text>
  <text x="380" y="764" class="text-muted" font-size="10">Благодарность 2x</text>
</svg>