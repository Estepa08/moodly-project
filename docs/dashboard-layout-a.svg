<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" font-family="system-ui, sans-serif">
  <title>Dashboard Вариант A — только статистика</title>
  <style>
    .bg { fill: #f5f5f4; }
    .card { fill: #fff; stroke: #e7e5e4; stroke-width: 1; rx: 12; }
    .chip { fill: #f0f0ee; rx: 8; }
    .text-dark { fill: #1c1917; font-size: 14px; font-weight: 600; }
    .text-muted { fill: #a8a29e; font-size: 11px; }
    .score { fill: #6366f1; font-size: 30px; font-weight: 700; }
    .chart-line { fill: none; stroke-width: 2; }
    .dot { r: 4; }
  </style>
  <rect class="bg" width="480" height="540"/>

  <!-- Period Selector -->
  <rect class="card" x="16" y="16" width="448" height="44"/>
  <text x="32" y="44" class="text-dark">Аналитика</text>
  <rect class="chip" x="280" y="24" width="168" height="28"/>
  <text x="296" y="43" class="text-muted">За 2 недели</text>

  <!-- WellbeingCard — hero -->
  <a href="/reports">
    <rect class="card" x="16" y="76" width="448" height="64"/>
    <text x="32" y="112" font-size="14" font-weight="600" fill="#1c1917">Сердечко Самочувствие</text>
    <text x="400" y="112" class="score" text-anchor="end">7.2</text>
    <polyline points="408,112 412,104 416,112 420,104 424,112" fill="none" stroke="#6366f1" stroke-width="2.5"/>
    <text x="432" y="112" font-size="12" fill="#a8a29e">→</text>
  </a>

  <!-- Parameter Trends Chart -->
  <rect class="card" x="16" y="156" width="448" height="350"/>

  <!-- Chart header -->
  <rect x="32" y="172" width="16" height="16" rx="4" fill="#6366f1" opacity="0.3"/>
  <text x="56" y="185" class="text-dark">Как вы себя чувствовали</text>

  <!-- Chart plot area -->
  <rect class="chip" x="32" y="204" width="416" height="130"/>
  <line x1="48" y1="320" x2="432" y2="320" stroke="#d6d3d1" stroke-width="0.5"/>
  <line x1="48" y1="298" x2="432" y2="298" stroke="#d6d3d1" stroke-width="0.5"/>
  <line x1="48" y1="276" x2="432" y2="276" stroke="#d6d3d1" stroke-width="0.5"/>
  <line x1="48" y1="254" x2="432" y2="254" stroke="#d6d3d1" stroke-width="0.5"/>
  <line x1="48" y1="232" x2="432" y2="232" stroke="#d6d3d1" stroke-width="0.5"/>
  <line x1="48" y1="210" x2="432" y2="210" stroke="#d6d3d1" stroke-width="0.5"/>

  <!-- Mood line (purple) -->
  <polyline class="chart-line" stroke="#a855f7" points="64,290 160,270 256,280 352,260 440,275"/>
  <circle cx="64" cy="290" fill="#a855f7" class="dot"/>
  <circle cx="160" cy="270" fill="#a855f7" class="dot"/>
  <circle cx="256" cy="280" fill="#a855f7" class="dot"/>
  <circle cx="352" cy="260" fill="#a855f7" class="dot"/>
  <circle cx="440" cy="275" fill="#a855f7" class="dot"/>

  <!-- Sleep line (amber) -->
  <polyline class="chart-line" stroke="#f59e0b" points="64,300 160,285 256,310 352,270 440,290"/>
  <circle cx="64" cy="300" fill="#f59e0b" class="dot"/>
  <circle cx="160" cy="285" fill="#f59e0b" class="dot"/>
  <circle cx="256" cy="310" fill="#f59e0b" class="dot"/>
  <circle cx="352" cy="270" fill="#f59e0b" class="dot"/>
  <circle cx="440" cy="290" fill="#f59e0b" class="dot"/>

  <!-- Y-axis labels -->
  <text x="44" y="323" font-size="9" fill="#d6d3d1" text-anchor="end">0</text>
  <text x="44" y="214" font-size="9" fill="#d6d3d1" text-anchor="end">10</text>

  <!-- Toggle buttons (4 params, fixed i18n) -->
  <rect class="chip" x="32" y="348" width="88" height="28"/>
  <circle cx="44" cy="362" fill="#6366f1" r="4"/>
  <text x="52" y="367" class="text-muted">Тревожность</text>

  <rect class="chip" x="128" y="348" width="66" height="28"/>
  <circle cx="140" cy="362" fill="#f59e0b" r="4"/>
  <text x="148" y="367" class="text-muted">Сон</text>

  <rect class="chip" x="202" y="348" width="88" height="28"/>
  <circle cx="214" cy="362" fill="#a855f7" r="4"/>
  <text x="222" y="367" class="text-muted">Настроение</text>

  <rect class="chip" x="298" y="348" width="72" height="28"/>
  <circle cx="310" cy="362" fill="#22c55e" r="4"/>
  <text x="318" y="367" class="text-muted">Энергия</text>

  <!-- "All reports" link -->
  <text x="408" y="496" class="text-muted" text-anchor="end">Все отчёты →</text>

  <!-- Bottom label -->
  <text x="240" y="530" class="text-muted" text-anchor="middle" font-size="10">Дашборд — только статистика, чисто и понятно</text>
</svg>