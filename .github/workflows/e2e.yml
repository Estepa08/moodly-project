name: E2E

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/src/**"
      - "e2e/**"
      - "prisma/**"
      - ".prisma/**"
      - "api-contract/**"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moodly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/moodly_test?schema=public
      JWT_SECRET: test-secret
      FRONTEND_URL: http://localhost:5173
      PORT: "3002"
      RATE_LIMIT_MAX: "10000"
      RATE_LIMIT_WRITE_MAX: "10000"
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Setup backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma db push --force-reset --accept-data-loss --skip-generate
          PROD_SEED=1 SEED_CONTENT_ONLY=1 npx tsx src/seed.ts
          nohup npx tsx src/index.ts > /tmp/backend.log 2>&1 &
          sleep 8
          curl -fsS http://localhost:3002/health || cat /tmp/backend.log

      - name: Setup frontend
        working-directory: frontend
        run: |
          npm ci
          nohup npm run dev > /tmp/frontend.log 2>&1 &
          sleep 8
          curl -fsS -o /dev/null http://localhost:5173 || cat /tmp/frontend.log

      - name: Install Playwright browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          E2E_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ -n "$E2E_BASE_REF" ]]; then
            # PR: запускаем только спеки, затронутые изменениями ветки
            node run-affected.mjs --base "origin/${E2E_BASE_REF}" --workers 4 || [ $? -eq 3 ]
          else
            # schedule / вручную: полный прогон
            npx playwright test --workers 4
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e/test-results
          retention-days: 7
