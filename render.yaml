previews:
  generation: automatic

services:
  - type: web
    name: moodly
    runtime: docker
    repo: https://github.com/Estepa08/moodly-project
    branch: main
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moodly-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://moodly-oyew.onrender.com
      - key: COOKIE_SAMESITE
        value: lax
      - key: NODE_ENV
        value: production

databases:
  - name: moodly-db
    plan: free
    databaseName: moodly
    user: moodly
