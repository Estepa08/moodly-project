previews:
  generation: automatic

services:
  - type: web
    name: moodly
    runtime: docker
    repo: https://github.com/Estepa08/moodly-project
    branch: main
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://moodly-oyew.onrender.com
      - key: COOKIE_SAMESITE
        value: lax
      - key: NODE_ENV
        value: production

  # Тестовый стенд для e2e-сценариев Playwright (отдельная БД, открытая регистрация).
  # URL будет присвоен Render'ом при создании — обновите FRONTEND_URL.
  - type: web
    name: moodly-e2e
    runtime: docker
    repo: https://github.com/Estepa08/moodly-project
    branch: main
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://moodly-e2e.onrender.com
      - key: COOKIE_SAMESITE
        value: lax
      - key: E2E_SEED
        value: "1"
      - key: NODE_ENV
        value: test
